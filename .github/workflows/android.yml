name: Android verify and package
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore generated Flutter Android wrapper
        run: flutter create --platforms=android --project-name golyapooch --org com.mahdi .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: golyapooch-android-unsigned-store-ready-no
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
